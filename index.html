    b.textContent=v;
    b.onclick=()=>ans(v,q[1],b,token);
    $("answers").appendChild(b);
  });

  $("combo").classList.toggle("hide",S.combo<2);
  $("combo").querySelector("span").textContent=S.combo;
  $("msg").textContent="よみかたを えらぼう！";
}

function calcScore(gameOver=false){
  // Time bonus changes by exactly 30 points for every 1 second.
  // 0-59.9s: 1800 - elapsed*30. 60s or more: 0.
  const correctPts=S.correct*300;
  const killPts=S.kills*220;
  const comboPts=S.max*70;

  // ゲームオーバー時はタイムボーナスを一切加算しない。
  // クリアした場合だけ、クリアタイムに応じたボーナスを加算する。
  const timeBonus=gameOver
    ? 0
    : Math.max(0,Math.round(1800-S.elapsed*30));

  let timeRank="E";
  if(!gameOver){
    if(S.elapsed<20) timeRank="S";
    else if(S.elapsed<30) timeRank="A";
    else if(S.elapsed<40) timeRank="B";
    else if(S.elapsed<50) timeRank="C";
    else if(S.elapsed<60) timeRank="D";
  }

  return {
    correctPts,
    killPts,
    comboPts,
    timeBonus,
    timeRank,
    total:correctPts+killPts+comboPts+timeBonus
  };
}

function gameOver(token){
  if(!validRun(token) || S.over)return;
  clearTimer();
  S.elapsed=(performance.now()-S.startAt)/1000;
  S.over=true;
  S.lock=true;
  document.querySelectorAll(".answer").forEach(x=>x.disabled=true);
  showResult(true);
}

function finish(token){
  // The 10th question is the authoritative end of a run.
  // A stale callback must never block the result screen, while the guard
  // below prevents the same run from showing the result twice.
  if(S.resultShown || S.over)return;
  if(token!==S.run && S.q<9)return;
  if(S.q<9)return;

  clearTimer();
  S.elapsed=(performance.now()-S.startAt)/1000;
  S.over=true;
  S.lock=true;
  S.resultShown=true;
  document.querySelectorAll(".answer").forEach(x=>x.disabled=true);

  try{
    showResult(false);
  }catch(err){
    console.error("Result screen error:",err);
    // Last-resort fallback: never leave the user trapped on question 10.
    const game=document.getElementById("game");
    const result=document.getElementById("result");
    if(game){game.classList.remove("active");game.style.display="none";}
    if(result){result.classList.add("active");result.style.display="block";}
  }
}

function scheduleNextQuestion(token, delay){
  clearTimeout(S.timer);
  S.timer=setTimeout(()=>{
    S.timer=null;

    if(S.q>=9){
      finish(token);
      return;
    }
    if(token!==S.run || S.over)return;

    S.q++;
    spawnEnemy(S.enemyIndex+1);
    render(token);
  },delay);
}

function scheduleNextQuestionNoEnemyChange(token, delay){
  clearTimeout(S.timer);
  S.timer=setTimeout(()=>{
    S.timer=null;

    if(S.q>=9){
      finish(token);
      return;
    }
    if(token!==S.run || S.over)return;

    S.q++;
    render(token);
  },delay);
}

function ans(v,c,b,token){
  if(!validRun(token) || S.lock)return;

  S.lock=true;
  if(window.kqPlaySfx)
  document.querySelectorAll(".answer").forEach(x=>x.disabled=true);
  let ch=C[S.char];

  if(v===c){
    b.classList.add("correct");
    S.correct++;
    S.combo++;

    // Live score is awarded at the exact moment each event happens.
    // Correct answer: +300
    S.score += 300;

    // New maximum combo: +70 immediately.
    const previousMax = S.max;
    S.max = Math.max(S.max, S.combo);
    if(S.max > previousMax){
      S.score += 70;
    }

    // Character-specific attack power.
    // All characters gain a small combo bonus, while their base attack
    // determines the intended full-correctness defeat ranking:
    // KAIRI > SOTA > CASTOR > KAPPA.
    let baseAttack={
      // v4.15: Enemy HP is identical in every stage.
      // Stage differences are illustration + appearance order ONLY.
      // 10/10 perfect run defeat counts are identical in every stage:
      // KAIRI 7 / SOTA 6 / CASTOR 5 / KAPPA 4.
      kairi:36,
      sota:32,
      castor:28,
      kappa:18
    }[S.char] || 28;

    let dmg=baseAttack + S.combo*2;

    S.eh=Math.max(0,S.eh-dmg);

    kqPlayFinalBattleSE('seikai.mp3');
    kqPlayFinalBattleSE('kairiandcastorkougeki.mp3');
    $("msg").textContent="✨ せいかい！ "+ch[0]+"のこうげき！";
    $("slash").classList.remove("hide");
    $("damage").classList.remove("hide");
    $("damage").textContent="-"+dmg;

    const fxToken=token;
    setTimeout(()=>{
      if(fxToken===S.run){
        $("slash").classList.add("hide");
        $("damage").classList.add("hide");
      }
    },420);

    toast("コンボ ×"+S.combo+"!");

    if(S.eh<=0){
      const enemies=getStageEnemies();
      const e=enemies[S.enemyIndex%enemies.length];
      S.kills++;

      // Enemy defeat: +220 immediately, at the moment of the kill.
      S.score += 220;
      setscore();

      // Show the enemy HP reaching zero before switching enemies.
      S.eh=0;
      $("ehp").style.width="0%";
      $("et").textContent="0/"+S.emax;
      $("msg").textContent="💥 "+e.name+" を たおした！";
      toast("★ たおした！ ★");

      // Everyone gets exactly 10 questions.
      scheduleNextQuestion(token,1100);
      return;
    }

  }else{
    kqPlayBattleSE('wrong');
    b.classList.add("wrong");
    if(S.char!=="kappa")S.combo=0;
    S.ph=Math.max(0,S.ph-10);

    $("msg").textContent=S.char==="kappa"
      ?"💧 まちがえた！でもコンボはつづく！"
      :"💥 ざんねん！ こうげきされた！";
    toast("もういっかい やってみよう！");

    if(S.ph<=0){
      $("php").style.width="0%";
      $("pt").textContent="0/"+S.pmax;
      $("msg").textContent="💀 HPが 0 になった！ ゲームオーバー";

      S.timer=setTimeout(()=>{
        S.timer=null;
        if(validRun(token))gameOver(token);
      },500);
      return;
    }
  }

  setscore();
  $("ehp").style.width=S.eh/S.emax*100+"%";
  $("et").textContent=S.eh+"/"+S.emax;
  $("php").style.width=S.ph/S.pmax*100+"%";
  $("pt").textContent=S.ph+"/"+S.pmax;
  $("combo").classList.toggle("hide",S.combo<2);
  $("combo").querySelector("span").textContent=S.combo;

  scheduleNextQuestionNoEnemyChange(token,650);
}

<script>
(function(){
  const s=document.getElementById("kqSelectBGM");
  const b=document.getElementById("kqBattleBGM");
  const sfx={
    titleStart:document.getElementById("kqSfxTitleStart"),
    cursor:document.getElementById("kqSfxCursor"),
    answer:document.getElementById("kqSfxAnswer"),
    battleStart:document.getElementById("kqSfxBattleStart"),
    stageSelect:document.getElementById("kqSfxStageSelect"),
    cancel:document.getElementById("kqSfxCancel")
  };
  if(!s||!b||Object.values(sfx).some(a=>!a))return;
  // KANJI QUEST standard volume reference (dB):
  // BGM -18 dB / cursor -14 dB / decision -8 dB.
  const dbToGain=db=>Math.pow(10,db/20);
  const TARGET=dbToGain(-18);
  const START=dbToGain(-30);
  const FADE_MS=1200;
  let fadeTimer=null;
  let active=null;
  let cursorSfxBlockedUntil=0;
  let sfxAudioContext=null;
  const sfxGainNodes=new Map();
  function clearFade(){if(fadeTimer){clearInterval(fadeTimer);fadeTimer=null;}}
  function stop(a){try{a.pause();a.currentTime=0;a.volume=0;}catch(e){}}
  function fadeIn(a){
    clearFade();
    try{a.volume=START; const p=a.play(); if(p&&p.catch)p.catch(()=>{});}catch(e){return null;}
    const t0=performance.now();
    fadeTimer=setInterval(()=>{
      const t=Math.min(1,(performance.now()-t0)/FADE_MS);
      try{a.volume=START+(TARGET-START)*t;}catch(e){}
      if(t>=1)clearFade();
    },40);
    return true;
  }
  function playTrack(a){
    const other=a===s?b:s;
    if(active===a && !a.paused){return true;}
    clearFade();
    stop(other);
    try{a.pause();a.currentTime=0;a.volume=0;}catch(e){}
    active=a;
    return fadeIn(a);
  }
  window.kqPlaySelectBGM=function(){return playTrack(s)};
  window.kqPlayBattleBGM=function(){return playTrack(b)};
  window.kqStopAllBGM=function(){clearFade();active=null;stop(s);stop(b)};
  window.kqBlockCursorSfx=function(duration){
    cursorSfxBlockedUntil=Math.max(cursorSfxBlockedUntil, performance.now()+duration);
  };
  window.kqPlaySfx=function(name){
    if(name==="cursor" && performance.now()<cursorSfxBlockedUntil)return;
    const selected=sfx[name];
    if(!selected)return;
    // SFX use one channel: a fresh UI action replaces the prior effect instead
    // of creating overlapping or duplicated playback.  BGM is unaffected.
    Object.values(sfx).forEach(a=>{
      try{a.pause();a.currentTime=0;}catch(e){}
    });
    try{
      // Keep one playback channel while giving the cancel sound extra gain.
      // This avoids the distortion and doubled playback caused by layering it.
      if(!sfxAudioContext){
        const AudioContextClass=window.AudioContext||window.webkitAudioContext;
        if(AudioContextClass) sfxAudioContext=new AudioContextClass();
      }
      if(sfxAudioContext){
        let gain=sfxGainNodes.get(selected);
        if(!gain){
          const source=sfxAudioContext.createMediaElementSource(selected);
          gain=sfxAudioContext.createGain();
          source.connect(gain).connect(sfxAudioContext.destination);
          sfxGainNodes.set(selected,gain);
        }
        const gainDb = name==="cancel"
        ? null
        : name==="cursor"
          ? -14
          : -8;
      gain.gain.value = gainDb===null ? 1.8 : dbToGain(gainDb);
        if(sfxAudioContext.state==="suspended") sfxAudioContext.resume().catch(()=>{});
      }
      selected.volume = 1;
      const p=selected.play();
      if(p&&p.catch)p.catch(()=>{});
    }catch(e){}
  };

  window.addEventListener("load",function(){
    setTimeout(function(){
      const title=document.getElementById("titleScreen");
      const game=document.getElementById("game");
      const select=document.getElementById("select");
      const stage=document.getElementById("stageSelect");
      if(title && title.classList.contains("active")) return;
      if(game && game.classList.contains("active")){window.kqPlayBattleBGM();return;}
      if((stage && stage.classList.contains("active")) || (select && select.classList.contains("active"))){window.kqPlaySelectBGM();}
    },100);
  });
})();
</script>

<script>
/* KANJI QUEST audio preparation: preload all game SE/BGM without changing game logic */
(function(){
  const kqAudioIds = [
    "kqSfxTitleStart",
    "kqSfxCursor",
    "kqSfxAnswer",
    "kqSfxBattleStart",
    "kqSfxStageSelect",
    "kqSfxCancel"
  ];

  function kqAudioPrimeAll(){
    kqAudioIds.forEach(id=>{
      const a=document.getElementById(id);
      if(a){
        try { a.load(); } catch(e){}
      }
    });
  }

  window.kqAudioPrimeAll = kqAudioPrimeAll;
  window.addEventListener("load", kqAudioPrimeAll, {once:true});
})();
</script>
