<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8月ランキング - Canvas Rich Animation Demo</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:grid;place-items:center;
    background:#06131c;
    font-family:system-ui,"Noto Sans JP",sans-serif;
    overflow:hidden;
  }
  .demo{
    position:relative;
    width:min(520px,92vw);
    aspect-ratio:9/13;
    border:2px solid #5f8090;
    border-radius:18px;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 15%,rgba(43,119,174,.35),transparent 30%),
      linear-gradient(#102d3a,#07151e 70%);
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .scene{
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 50% 38%,rgba(255,211,71,.08),transparent 20%),
      linear-gradient(135deg,rgba(34,100,77,.55),transparent 35%),
      linear-gradient(315deg,rgba(21,66,52,.5),transparent 42%);
  }
  .title{
    position:absolute;
    left:50%;top:38%;
    transform:translate(-50%,-50%);
    z-index:3;
    width:100%;
    text-align:center;
    font-weight:900;
    font-size:clamp(28px,7vw,48px);
    letter-spacing:.08em;
    color:#ffd33d;
    text-shadow:
      0 2px 0 #7d3e00,
      0 4px 10px rgba(0,0,0,.7);
    white-space:nowrap;
  }
  .subtitle{
    position:absolute;left:50%;top:45%;
    transform:translateX(-50%);
    z-index:3;
    color:#d8edf5;font-size:14px;letter-spacing:.18em;
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
  .note{
    position:absolute;bottom:16px;left:0;right:0;
    z-index:4;text-align:center;color:#9fb6c1;font-size:11px;
    letter-spacing:.08em;
  }
</style>
</head>
<body>
<div class="demo">
  <div class="scene"></div>
  <canvas id="fx"></canvas>
  <div class="title">8月 ランキング</div>
  <div class="subtitle">MONTHLY RANKING</div>
  <div class="note">CANVAS / PARTICLE + LIGHT-RAY DEMO</div>
</div>

<script>
(() => {
  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d");
  const box = canvas.parentElement;
  const TAU = Math.PI * 2;
  let W=1,H=1,D=1,cx=0,cy=0;
  let rays=[], sparks=[], motes=[], pulses=[];
  let last=performance.now();
  let burstTimer=0;

  function resize(){
    const r=box.getBoundingClientRect();
    W=r.width; H=r.height; D=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(W*D);
    canvas.height=Math.round(H*D);
    ctx.setTransform(D,0,0,D,0,0);
    cx=W/2; cy=H*.38;
  }

  function spawnRay(force=false){
    const a=Math.random()*TAU;
    rays.push({
      a,
      age:0,
      delay:force?0:Math.random()*180,
      len:35+Math.random()*90,
      speed:.75+Math.random()*1.25,
      width:.7+Math.random()*1.8,
      inner:34+Math.random()*12,
      life:500+Math.random()*650,
      bend:(Math.random()-.5)*.16,
      hot:Math.random()>.55
    });
  }

  function spawnSpark(force=false){
    sparks.push({
      a:Math.random()*TAU,
      age:0,
      delay:force?0:Math.random()*350,
      dist:38+Math.random()*110,
      speed:.35+Math.random()*.9,
      life:500+Math.random()*900,
      size:.7+Math.random()*2.3,
      twinkle:Math.random()*TAU
    });
  }

  function spawnMote(){
    motes.push({
      a:Math.random()*TAU,
      r:28+Math.random()*125,
      age:0,
      life:900+Math.random()*1500,
      speed:.0005+Math.random()*.0012,
      size:.5+Math.random()*1.8
    });
  }

  function burst(){
    // A burst is the part that makes this visibly different from a simple CSS glow:
    // dozens of independently animated rays/particles are emitted at once.
    for(let i=0;i<14;i++){
      const a=(i/14)*TAU+(Math.random()-.5)*.12;
      rays.push({
        a,age:0,delay:i*12,
        len:55+Math.random()*110,
        speed:1.0+Math.random()*1.8,
        width:.6+Math.random()*1.4,
        inner:30+Math.random()*8,
        life:650+Math.random()*450,
        bend:(Math.random()-.5)*.08,
        hot:true
      });
    }
    for(let i=0;i<28;i++) spawnSpark(true);
    pulses.push({age:0,life:650});
  }

  for(let i=0;i<18;i++) spawnRay();
  for(let i=0;i<24;i++) spawnSpark();
  for(let i=0;i<35;i++) spawnMote();
  setTimeout(burst,800);

  function draw(now){
    const dt=Math.min(34,now-last); last=now;
    ctx.clearRect(0,0,W,H);

    ctx.save();
    ctx.translate(cx,cy);

    // Very restrained central glint — no yellow "membrane".
    const g=ctx.createRadialGradient(0,0,0,0,0,42);
    g.addColorStop(0,"rgba(255,223,92,.13)");
    g.addColorStop(1,"rgba(255,223,92,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,42,0,TAU); ctx.fill();

    // Moving micro-motes orbiting the title.
    for(let i=motes.length-1;i>=0;i--){
      const m=motes[i]; m.age+=dt;
      if(m.age>m.life){motes.splice(i,1);spawnMote();continue}
      const p=m.age/m.life;
      const a=m.a+m.age*m.speed;
      const r=m.r+Math.sin(m.age*.002+m.a)*7;
      const x=Math.cos(a)*r, y=Math.sin(a)*r;
      const alpha=Math.sin(Math.PI*p)*.55;
      ctx.fillStyle=`rgba(255,226,117,${alpha})`;
      ctx.shadowBlur=7;ctx.shadowColor=`rgba(255,190,35,${alpha})`;
      ctx.beginPath();ctx.arc(x,y,m.size,0,TAU);ctx.fill();
    }

    // Long, directional rays: they travel outward rather than merely changing opacity.
    for(let i=rays.length-1;i>=0;i--){
      const r=rays[i]; r.age+=dt;
      if(r.age>r.life+r.delay){rays.splice(i,1);continue}
      if(r.age<r.delay) continue;
      const p=Math.min(1,(r.age-r.delay)/r.life);
      const travel=1-Math.pow(1,p,2);
      const fade=p<.1?p/.1:Math.pow(1-p,1.55);
      const a=r.a+r.bend*travel;
      const x1=Math.cos(a)*r.inner, y1=Math.sin(a)*r.inner;
      const x2=Math.cos(a)*(r.inner+r.len*travel);
      const y2=Math.sin(a)*(r.inner+r.len*travel);

      ctx.save();
      ctx.globalCompositeOperation="lighter";
      // faint trailing line
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.lineWidth=r.width*3.2;
      ctx.strokeStyle=`rgba(255,181,30,${fade*.12})`;
      ctx.shadowBlur=14;ctx.shadowColor=`rgba(255,181,30,${fade*.35})`;ctx.stroke();
      // bright core
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
      ctx.lineWidth=r.width;
      ctx.strokeStyle=`rgba(255,225,105,${fade*(r.hot?.95:.72)})`;
      ctx.shadowBlur=6;ctx.shadowColor=`rgba(255,193,34,${fade})`;ctx.stroke();
      ctx.restore();
    }

    // Star-shaped spark particles.
    for(let i=sparks.length-1;i>=0;i--){
      const s=sparks[i];s.age+=dt;
      if(s.age>s.life+s.delay){sparks.splice(i,1);continue}
      if(s.age<s.delay)continue;
      const p=Math.min(1,(s.age-s.delay)/s.life);
      const fade=Math.sin(Math.PI*p);
      const d=s.dist+(1-Math.pow(1-p,1.7))*28;
      const a=s.a;
      const x=Math.cos(a)*d,y=Math.sin(a)*d;
      const tw=.55+.45*Math.sin(s.twinkle+s.age*.018);
      const sz=s.size*(.7+.5*tw);

      ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/4);
      ctx.globalCompositeOperation="lighter";
      ctx.fillStyle=`rgba(255,235,155,${fade*.9*tw})`;
      ctx.shadowBlur=9;ctx.shadowColor=`rgba(255,190,35,${fade})`;
      ctx.fillRect(-sz*.5,-sz*2.2,sz,sz*4.4);
      ctx.fillRect(-sz*2.2,-sz*.5,sz*4.4,sz);
      ctx.restore();
    }

    // Expanding ring from the title — a brief "power-up" pulse.
    for(let i=pulses.length-1;i>=0;i--){
      const p=pulses[i];p.age+=dt;
      if(p.age>p.life){pulses.splice(i,1);continue}
      const t=p.age/p.life;
      const rr=18+t*105;
      const alpha=(1-t)*.42;
      ctx.save();ctx.globalCompositeOperation="lighter";
      ctx.beginPath();ctx.arc(0,0,rr,0,TAU);
      ctx.lineWidth=1.2;
      ctx.strokeStyle=`rgba(255,216,79,${alpha})`;
      ctx.shadowBlur=10;ctx.shadowColor=`rgba(255,181,25,${alpha})`;
      ctx.stroke();ctx.restore();
    }

    ctx.restore();

    burstTimer+=dt;
    if(burstTimer>4700){burstTimer=0;burst()}
    requestAnimationFrame(draw);
  }

  window.addEventListener("resize",resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
