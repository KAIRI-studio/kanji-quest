const $=x=>document.getElementById(x);
const show=x=>{
  ["stageSelect","select","game","result"].forEach(y=>{
    const el=$(y);
    if(!el)return;
    el.classList.remove("active");
    el.style.display="none";
  });

function clearTimer(){
  if(S.timer!==null){
    clearTimeout(S.timer);
    S.timer=null;
  }
}

function newRun(){
  S.run++;
  clearTimer();
  return S.run;
}

function validRun(token){
  return token===S.run && !S.over;
}

function setscore(){
  $("score").textContent=String(S.score).padStart(5,"0");
}

function updateTime(){
  if(!validRun(S.run))return;
  S.elapsed=(performance.now()-S.startAt)/1000;
  $("time").textContent=S.elapsed.toFixed(1)+"s";
  requestAnimationFrame(updateTime);
}

function toast(t){
  $("toast").textContent=t;
  $("toast").classList.add("on");
  clearTimeout(window.cqToastTimer);
  window.cqToastTimer=setTimeout(()=>$("toast").classList.remove("on"),900);
}

function spawnEnemy(index){
  const e=ENEMIES[index%ENEMIES.length];
  S.enemyIndex=index%ENEMIES.length;
  S.emax=e.hp;
  S.eh=e.hp;

  $("enemyName").textContent=e.name;
  $("enemyImg").src=e.img;
  $("enemyImg").alt=e.name;
  $("enemy").style.filter="none";
  $("ehp").style.width="100%";
  $("et").textContent=S.eh+"/"+S.emax;
}

function render(token=S.run){
  if(!validRun(token))return;

  S.lock=false;
  $("qn").textContent=S.q+1;
  $("ehp").style.width=S.eh/S.emax*100+"%";
  $("et").textContent=S.eh+"/"+S.emax;
  $("php").style.width=S.ph/S.pmax*100+"%";
  $("pt").textContent=S.ph+"/"+S.pmax;

  let q=Q[Math.floor(Math.random()*Q.length)];
  $("kanji").textContent=q[0];
  $("answers").innerHTML="";

  sh(q.slice(1)).forEach(v=>{
    let b=document.createElement("button");
    b.className="answer";
    b.textContent=v;
    b.onclick=()=>ans(v,q[1],b,token);
    $("answers").appendChild(b);
  });

  $("combo").classList.toggle("hide",S.combo<2);
  $("combo").querySelector("span").textContent=S.combo;
  $("msg").textContent="よみかたを えらぼう！";
}

function calcScore(gameOver=false){
  // Time bonus changes by exactly 30 points for every 1 second.
  // 0-59.9s: 1800 - elapsed*30. 60s or more: 0.
  const correctPts=S.correct*300;
  const killPts=S.kills*220;
  const comboPts=S.max*70;

  // ゲームオーバー時はタイムボーナスを一切加算しない。
  // クリアした場合だけ、クリアタイムに応じたボーナスを加算する。
  const timeBonus=gameOver
    ? 0
    : Math.max(0,Math.round(1800-S.elapsed*30));

  let timeRank="E";
  if(!gameOver){
    if(S.elapsed<20) timeRank="S";
    else if(S.elapsed<30) timeRank="A";
    else if(S.elapsed<40) timeRank="B";
    else if(S.elapsed<50) timeRank="C";
    else if(S.elapsed<60) timeRank="D";
  }

  return {
    correctPts,
    killPts,
    comboPts,
    timeBonus,
    timeRank,
    total:correctPts+killPts+comboPts+timeBonus
  };
}

  $("fs").textContent=S.score.toLocaleString();
  $("cc").textContent=S.correct;
  $("mc").textContent=S.max;
  $("ex").textContent=S.correct*10+S.max*5+S.kills*20;
  $("rs").src=C[S.char][2];
  $("rn").textContent=C[S.char][0];
  $("rt").textContent=C[S.char][1];

  const boxes=document.querySelectorAll(".rg div");
  if(boxes.length>=3){
    boxes[0].innerHTML="正解<b>"+S.correct+"</b>/10";
    boxes[1].innerHTML="撃破<b>"+S.kills+"</b>体";
    boxes[2].innerHTML="コンボ<b>"+S.max+"</b>";
  }

  // Score breakdown: show exactly how the final score was made.
  let breakdown=document.getElementById("scoreBreakdown");
  if(!breakdown){
    breakdown=document.createElement("div");
    breakdown.id="scoreBreakdown";
    breakdown.className="score-breakdown";
    const scoreBox=$("fs").closest("div");
    if(scoreBox && scoreBox.parentNode){
      scoreBox.parentNode.insertBefore(breakdown, scoreBox.nextSibling);
    }
  }

  breakdown.innerHTML=
    '<div class="breakdown-title">スコアのうちわけ</div>'+
    '<div class="breakdown-row"><span>🈶 せいかい '+S.correct+'もん</span><b>+'+score.correctPts.toLocaleString()+'</b></div>'+
    '<div class="breakdown-row"><span>⚔️ たおした '+S.kills+'たい</span><b>+'+score.killPts.toLocaleString()+'</b></div>'+
    '<div class="breakdown-row"><span>🔥 コンボ '+S.max+'</span><b>+'+score.comboPts.toLocaleString()+'</b></div>'+
    '<div class="breakdown-row"><span>⏱️ タイム '+S.elapsed.toFixed(1)+'秒</span><b>+'+score.timeBonus.toLocaleString()+'</b></div>'+
    '<div class="breakdown-total"><span>TOTAL</span><b>'+score.total.toLocaleString()+'</b></div>';

  // Show clear time separately as well.
  let timeBox=document.getElementById("resultTime");
  if(!timeBox){
    const rg=document.querySelector(".rg");
    if(rg){
      timeBox=document.createElement("div");
      timeBox.id="resultTime";
      timeBox.style.cssText="font-size:16px;font-weight:900;margin:10px 0;text-align:center";
      rg.parentNode.insertBefore(timeBox,rg.nextSibling);
    }
  }
  if(timeBox)timeBox.innerHTML="タイム  "+S.elapsed.toFixed(1)+"秒";

  if(gameOver){
    $("rec").classList.add("hide");
    document.querySelector(".clear").textContent="ゲームオーバー";
    document.querySelector(".clear").style.color="#ff4b4b";
  }else{
    let n=S.score>S.best;
    if(n){
      S.best=S.score;
      localStorage.cqBest=S.best;
    }
    $("rec").classList.toggle("hide",!n);
    document.querySelector(".clear").textContent="★ クリア！ ★";
    document.querySelector(".clear").style.color="#ffd83d";
  }

  show("result");
}

function gameOver(token){
  if(!validRun(token))return;
  clearTimer();
  S.elapsed=(performance.now()-S.startAt)/1000;
  S.over=true;
  S.lock=true;
  document.querySelectorAll(".answer").forEach(x=>x.disabled=true);
  showResult(true);
}

function finish(token){
  if(!validRun(token))return;
  clearTimer();
  S.elapsed=(performance.now()-S.startAt)/1000;
  S.over=true;
  S.lock=true;
  document.querySelectorAll(".answer").forEach(x=>x.disabled=true);
  showResult(false);
}

function ans(v,c,b,token){
  if(!validRun(token) || S.lock)return;

  S.lock=true;
  document.querySelectorAll(".answer").forEach(x=>x.disabled=true);
  let ch=C[S.char];

  if(v===c){
    b.classList.add("correct");
    S.correct++;
    S.combo++;

    // Live score is awarded at the exact moment each event happens.
    // Correct answer: +300
    S.score += 300;

    // New maximum combo: +70 immediately.
    const previousMax = S.max;
    S.max = Math.max(S.max, S.combo);
    if(S.max > previousMax){
      S.score += 70;
    }

    // Character-specific attack power.
    // All characters gain a small combo bonus, while their base attack
    // determines the intended full-correctness defeat ranking:
    // KAIRI > SOTA > CASTOR > KAPPA.
    let baseAttack={
      kairi:42,
      sota:38,
      castor:30,
      kappa:16
    }[S.char] || 30;

    let dmg=baseAttack + S.combo*2;

    S.eh=Math.max(0,S.eh-dmg);

    $("msg").textContent="✨ せいかい！ "+ch[0]+"のこうげき！";
    $("slash").classList.remove("hide");
    $("damage").classList.remove("hide");
    $("damage").textContent="-"+dmg;

    const fxToken=token;
    setTimeout(()=>{
      if(fxToken===S.run){
        $("slash").classList.add("hide");
        $("damage").classList.add("hide");
      }
    },420);

    toast("コンボ ×"+S.combo+"!");

    if(S.eh<=0){
      const e=ENEMIES[S.enemyIndex%ENEMIES.length];
      S.kills++;

      // Enemy defeat: +220 immediately, at the moment of the kill.
      S.score += 220;
      setscore();

      // Show the enemy HP reaching zero before switching enemies.
      S.eh=0;
      $("ehp").style.width="0%";
      $("et").textContent="0/"+S.emax;
      $("msg").textContent="💥 "+e.name+" を たおした！";
      toast("★ たおした！ ★");

      S.timer=setTimeout(()=>{
        S.timer=null;
        if(!validRun(token))return;

        if(S.q>=9){
          finish(token);
        }else{
          S.q++;
          spawnEnemy(S.enemyIndex+1);
          render(token);
        }
      },1100);
      return;
    }

  }else{
    b.classList.add("wrong");
    if(S.char!=="kappa")S.combo=0;
    S.ph=Math.max(0,S.ph-10);

    $("msg").textContent=S.char==="kappa"
      ?"💧 まちがえた！でもコンボはつづく！"
      :"💥 ざんねん！ こうげきされた！";
    toast("もういっかい やってみよう！");

    if(S.ph<=0){
      $("php").style.width="0%";
      $("pt").textContent="0/"+S.pmax;
      $("msg").textContent="💀 HPが 0 になった！ ゲームオーバー";

      S.timer=setTimeout(()=>{
        S.timer=null;
        if(validRun(token))gameOver(token);
      },500);
      return;
    }
  }

  setscore();
  $("ehp").style.width=S.eh/S.emax*100+"%";
  $("et").textContent=S.eh+"/"+S.emax;
  $("php").style.width=S.ph/S.pmax*100+"%";
  $("pt").textContent=S.ph+"/"+S.pmax;
  $("combo").classList.toggle("hide",S.combo<2);
  $("combo").querySelector("span").textContent=S.combo;

  S.timer=setTimeout(()=>{
    S.timer=null;
    if(!validRun(token))return;

    S.q++;
    if(S.q>=10)finish(token);
    else render(token);
  },650);
}

$("start").onclick=start;

$("retry").onclick=()=>{
  sessionStorage.setItem("cqAutoStart",S.char||"");
  window.location.reload();
};

$("change").onclick=()=>{
  // いったんページを再読み込みして戦闘の実行状態を完全に初期化する。
  // 現在の学年だけ保存し、再読み込み後は同じ学年のキャラクター選択へ戻す。
  sessionStorage.removeItem("cqAutoStart");
  sessionStorage.setItem("cqReturnStage", String(S.stage || 1));
  window.location.reload();
};

<script>
(function(){
  const back = document.getElementById("characterBack");
  if(!back) return;
  back.addEventListener("click", function(){
    const select = document.getElementById("select");
    const stage = document.getElementById("stageSelect");
    if(select) { select.classList.remove("active"); select.style.display="none"; }
    if(stage) { stage.classList.add("active"); stage.style.display="block"; }
    window.scrollTo(0,0);
  });
})();
</script>

<script>
(function(){
  const quit = document.getElementById("quitBattle");
  if(!quit) return;

  quit.onclick = function(e){
    e.preventDefault();
    e.stopPropagation();

    // Cancel all pending game callbacks and invalidate the current run.
    newRun();

    S.score=0;
    S.combo=0;
    S.max=0;
    S.correct=0;
    S.kills=0;
    S.q=0;
    S.ph=40;
    S.pmax=40;
    S.eh=0;
    S.elapsed=0;
    S.lock=true;
    S.over=true;

    setscore();
    quit.style.display="none";

    document.getElementById("game").style.display="none";
    document.getElementById("game").classList.remove("active");
    document.getElementById("select").style.display="none";
    document.getElementById("select").classList.remove("active");
    document.getElementById("result").style.display="none";
    document.getElementById("result").classList.remove("active");

    const stage=document.getElementById("stageSelect");
    stage.style.display="block";
    stage.classList.add("active");

    window.scrollTo(0,0);
  };
})();
</script>
